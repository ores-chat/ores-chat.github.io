[package]
org = "ores-chat"
name = "ores-chat-github-io"
version = "0.1.0"
description = "Public Astro site and reviewed browser artifact distribution for ORES Chat"
license = "LicenseRef-Proprietary"
keywords = ["astro", "chat", "components", "marketing", "static-site"]
language = "universal"

[package.repository]
vcs = "git"
url = "https://github.com/ores-chat/ores-chat.github.io"

[dependencies]
"ores-chat/ores-chat-assets" = "^0.1.0"
"ores-chat/ores-chat-external-components" = "^0.1.0"
"ores-chat/ores-chat-pub-lib-core" = "^0.1.0"

[build]
command = "npm ci --ignore-scripts --no-audit --no-fund && npm run build"
outputs = ["dist"]

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/package.json\" && test -f \"$ZED_PKG_TEST_TARGET/src/pages/index.astro\""
exclude = [".env", ".env.*", ".direnv/**", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "node_modules/**", "dist/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
dir = ".vendor/.zed"

[targets.site]
dir = "."
adapter = "node"

[scripts]
test = "npm test"
